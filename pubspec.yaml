name: bouquetblossom
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^7.0.2
  audioplayers: ^6.1.0
  shared_preferences: ^2.3.3
  timer_button: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/bouquets/
    - assets/audio/
    - assets/data/

  fonts:
    - family: ChettaVissto
      fonts:
        - asset: fonts/ChettaVissto.ttf
